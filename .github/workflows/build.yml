name: Build and Release

# Push a tag like v1.1.7 to build Windows + macOS and attach the zips to a
# GitHub Release. Or run manually (workflow_dispatch) to just get the zips as
# downloadable artifacts without creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi

      - name: Build AutoBible.exe
        run: >
          python -m PyInstaller --onedir --windowed --noconfirm --clean
          --icon=icon.ico --name AutoBible autobible.py

      - name: Assemble package
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content autobible.py -Raw), '__version__\s*=\s*"(.+?)"')).Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item icon.ico dist/AutoBible/ -Force
          New-Item -ItemType Directory -Force dist/AutoBible/bible_versions | Out-Null
          Copy-Item bible_versions/KRV.SQLite3 dist/AutoBible/bible_versions/ -Force
          New-Item -ItemType Directory -Force dist/AutoBible/original_lang | Out-Null
          Copy-Item original_lang/* dist/AutoBible/original_lang/ -Force
          Compress-Archive -Path dist/AutoBible/* -DestinationPath "AutoBible-windows-v$v.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AutoBible-windows-*.zip

  # -------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi

      - name: Generate icns icon
        run: |
          if [ -f icon.png ]; then
            sips -s format icns icon.png --out icon.icns || echo "icns conversion failed; building without icon"
          fi

      - name: Build AutoBible.app
        run: |
          if [ -f icon.icns ]; then
            python -m PyInstaller --onedir --windowed --noconfirm --clean --icon=icon.icns --name AutoBible autobible.py
          else
            python -m PyInstaller --onedir --windowed --noconfirm --clean --name AutoBible autobible.py
          fi

      - name: Assemble package
        run: |
          V=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('autobible.py').read()).group(1))")
          if [ -d dist/AutoBible.app ]; then
            APP="dist/AutoBible.app"
          else
            APP="dist/AutoBible/AutoBible.app"
          fi
          # Bundle data INSIDE the .app so it survives App Translocation and the
          # app being moved (data sits next to the executable in Contents/MacOS).
          MACOS="$APP/Contents/MacOS"
          mkdir -p "$MACOS/bible_versions" && cp bible_versions/KRV.SQLite3 "$MACOS/bible_versions/"
          mkdir -p "$MACOS/original_lang" && cp original_lang/* "$MACOS/original_lang/"
          # Stamp the real version into Info.plist (PyInstaller leaves 0.0.0)
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $V" "$PLIST"
          # Copying into the bundle invalidated PyInstaller's signature, which
          # makes macOS report the app as "damaged". Re-sign ad-hoc to re-seal.
          codesign --force --deep --sign - "$APP" || echo "codesign failed (continuing)"
          # Copy with ditto (NOT cp -R) so the code signature is preserved;
          # cp -R breaks signing and macOS then reports the app as "damaged".
          OUT="AutoBible-mac"
          rm -rf "$OUT" && mkdir -p "$OUT"
          ditto "$APP" "$OUT/AutoBible.app"
          # zip — used by the in-app auto-updater
          ( cd "$OUT" && zip -r -y "../AutoBible-macos-v$V.zip" . )
          # dmg — friendly drag-to-Applications installer
          STAGE="dmg_stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/AutoBible.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "AutoBible" -srcfolder "$STAGE" -ov \
            -format UDZO "AutoBible-macos-v$V.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            AutoBible-macos-*.zip
            AutoBible-macos-*.dmg

  # -------------------------------------------------------------------
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Attach builds to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/*.zip
            macos/*.zip
            macos/*.dmg
